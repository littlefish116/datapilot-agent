
name: DataPilot Lightweight CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  sql-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Python syntax
        run: python -m compileall -q app scripts tests

      - name: Run independent SQL unit tests
        run: python -m unittest discover -s tests -p "test_sql_metrics.py" -v
