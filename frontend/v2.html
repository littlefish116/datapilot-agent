<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>DataPilot V2 · 动态业务查询</title>
  <style>
    :root { --ink:#17283f; --muted:#63738a; --line:#dde5f0; --bg:#f4f7fb; --white:#fff; --blue:#225bd5; --blue-soft:#eaf1ff; --amber:#905c12; --amber-soft:#fff6e4; --red:#a32e38; --red-soft:#fff0f1; --green:#146d4b; --green-soft:#e7f6ef; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.65 system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif; color:var(--ink); background:var(--bg); }
    a { color:var(--blue); }
    header { background:#152a4b; color:white; padding:24px max(20px,calc((100vw - 1120px)/2)); }
    .brand { display:flex; justify-content:space-between; gap:18px; align-items:center; }
    .brand strong { font-size:22px; letter-spacing:.3px; }
    .brand a { color:#d7e5ff; text-decoration:none; border:1px solid #6680a5; border-radius:9px; padding:6px 12px; font-size:13px; }
    header p { margin:7px 0 0; color:#c3d4ec; font-size:13px; }
    main { width:min(1120px,calc(100% - 32px)); margin:24px auto 70px; display:grid; grid-template-columns:300px minmax(0,1fr); gap:20px; align-items:start; }
    .panel { background:var(--white); border:1px solid var(--line); border-radius:15px; box-shadow:0 7px 22px rgba(23,40,63,.04); padding:22px; min-width:0; }
    h1 { margin:0 0 8px; font-size:22px; line-height:1.35; }
    h2 { margin:0 0 14px; font-size:16px; }
    p { margin:0 0 12px; }
    .muted, .hint { color:var(--muted); font-size:13px; }
    .aside-heading { margin-top:0; }
    .example { display:block; width:100%; margin:9px 0; text-align:left; padding:12px 13px; background:#f8faff; border:1px solid var(--line); border-radius:10px; color:var(--ink); cursor:pointer; font:inherit; font-size:13px; line-height:1.5; }
    .example:hover, .example:focus-visible { outline:2px solid #aac7ff; outline-offset:1px; }
    .tip { margin-top:21px; padding:13px; border-radius:10px; background:var(--blue-soft); color:#26486f; font-size:12px; }
    label { display:block; font-weight:700; margin:15px 0 8px; }
    textarea { display:block; width:100%; resize:vertical; min-height:110px; padding:12px 14px; color:var(--ink); font:inherit; font-size:14px; line-height:1.7; border-radius:10px; border:1px solid #b9c8dc; }
    textarea:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
    .actions { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin:13px 0 0; }
    button.primary { border:0; background:var(--blue); color:white; border-radius:9px; padding:10px 21px; font:inherit; font-weight:700; cursor:pointer; }
    button.secondary { background:white; border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; font:inherit; font-size:12px; color:var(--ink); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .result { margin-top:20px; }
    .result[hidden], .status[hidden], .metricline[hidden], .result-table[hidden], details[hidden] { display:none; }
    .status { border-radius:10px; padding:12px 14px; font-size:13px; margin:4px 0 16px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .status.ok { background:var(--green-soft); color:var(--green); }
    .status.warn { background:var(--amber-soft); color:var(--amber); }
    .status.error { background:var(--red-soft); color:var(--red); }
    .status.neutral { background:var(--blue-soft); color:#26486f; }
    .result-table { overflow:auto; border:1px solid var(--line); border-radius:10px; max-height:430px; }
    table { border-collapse:collapse; width:100%; font-size:13px; }
    th, td { border-bottom:1px solid var(--line); padding:10px 12px; text-align:left; white-space:nowrap; }
    th { position:sticky; top:0; background:#eef3fa; font-weight:700; }
    tr:last-child td { border-bottom:0; }
    td { font-variant-numeric:tabular-nums; }
    .metricline { color:var(--muted); font-size:12px; margin:10px 0; }
    details { margin-top:16px; border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
    summary { cursor:pointer; font-weight:700; font-size:13px; }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#f3f6fa; padding:12px; border-radius:8px; font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace; color:#23354d; max-height:330px; overflow:auto; }
    .risk-item { padding:10px 12px; border-left:3px solid #b78b44; background:#fff9ed; border-radius:0 7px 7px 0; margin:8px 0; font-size:13px; overflow-wrap:anywhere; }
    .risk-item code { display:block; font-weight:bold; }
    .meta { display:flex; flex-wrap:wrap; column-gap:18px; row-gap:4px; color:var(--muted); font-size:12px; margin-top:12px; }
    .footer-note { border-top:1px solid var(--line); padding-top:15px; margin:20px 0 0; font-size:12px; color:var(--muted); }
    @media (max-width:780px) { main { grid-template-columns:1fr; } .panel { padding:17px; } header { padding:20px; } }
    @media (prefers-reduced-motion:no-preference) { button { transition:background-color .15s ease; } }
  </style>
</head>
<body>
<header>
  <div class="brand"><strong>DataPilot <span style="font-size:14px;color:#a7c6ff">V2</span></strong><a href="/">返回 V1 Agent</a></div>
  <p>动态业务分析 · Text-to-SQL · 只读执行 · 语义风险提示</p>
</header>
<main>
  <aside class="panel">
    <h2 class="aside-heading">尝试这些问题</h2>
    <button type="button" class="example" data-question="2018年3月购买且已交付的订单有多少笔？">2018 年 3 月已交付订单数</button>
    <button type="button" class="example" data-question="2018年第二季度每月已交付订单的平均商品金额是多少？">第二季度月均商品金额</button>
    <button type="button" class="example" data-question="2018年3月已交付订单的延期率是多少？">3 月已交付订单的延期率</button>
    <div class="tip">实验模式：每次提交独立生成一条 SQL，不会自动修复，也不会跨轮记忆。示例仅供测试，并不保证任何一次生成结果必然正确。</div>
    <p class="footer-note">仅适用于本机历史 Olist 数据分析。请勿将已启用的试验服务暴露到公网。风险提示并非业务语义正确性证明。</p>
  </aside>
  <section class="panel" aria-label="V2 动态分析工作台">
    <h1>用自然语言查询历史业务数据</h1>
    <p class="muted">模型负责提出 SQL；安全执行器负责限制权限与资源。存在已知语义风险时，不执行查询。</p>
    <form id="query-form">
      <label for="question">业务问题</label>
      <textarea id="question" name="question" minlength="1" maxlength="2000" required placeholder="例如：2018年3月购买且已交付的订单有多少笔？"></textarea>
      <div class="actions"><span class="hint">Ctrl + Enter 提交 · 每次提问可能产生 API 费用</span><button type="submit" id="submit" class="primary">生成并查询</button></div>
    </form>
    <section class="result" id="result" aria-label="查询结果" hidden>
      <div id="status" class="status neutral" role="status" aria-live="polite"></div>
      <section id="risk-panel" hidden><h2>业务语义风险</h2><div id="risk-list"></div></section>
      <div id="metricline" class="metricline" hidden></div>
      <div id="result-table" class="result-table" role="region" aria-label="查询数据表" tabindex="0" hidden></div>
      <details id="sql-details" hidden><summary>查看生成的 SQL</summary><pre id="sql-code"></pre><button class="secondary" id="copy-sql" type="button">复制 SQL</button></details>
      <div id="meta" class="meta"></div>
    </section>
  </section>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const form = $('query-form');
  const input = $('question');
  const submit = $('submit');
  const result = $('result');
  const statusBox = $('status');
  const riskPanel = $('risk-panel');
  const riskList = $('risk-list');
  const metricLine = $('metricline');
  const tableWrap = $('result-table');
  const sqlDetails = $('sql-details');
  const sqlCode = $('sql-code');
  const meta = $('meta');
  let busy = false;
  let lastSql = '';

  function setStatus(kind, message) {
    statusBox.className = 'status ' + kind;
    statusBox.textContent = message;
  }
  function resetResult() {
    result.hidden = false;
    riskPanel.hidden = true;
    riskList.replaceChildren();
    tableWrap.hidden = true;
    tableWrap.replaceChildren();
    metricLine.hidden = true;
    metricLine.textContent = '';
    sqlDetails.hidden = true;
    sqlDetails.open = false;
    sqlCode.textContent = '';
    meta.replaceChildren();
    lastSql = '';
  }
  function labelLine(key, value) {
    const item = document.createElement('span');
    item.textContent = key + '：' + value;
    meta.appendChild(item);
  }
  function showRisks(riskReview) {
    const risks = Array.isArray(riskReview?.risks) ? riskReview.risks : [];
    if (!risks.length) return;
    riskPanel.hidden = false;
    for (const risk of risks) {
      const box = document.createElement('div');
      box.className = 'risk-item';
      const code = document.createElement('code');
      code.textContent = String(risk?.code ?? 'RISK');
      box.appendChild(code);
      const detail = document.createElement('div');
      detail.textContent = String(risk?.detail ?? '需人工核验业务统计口径');
      box.appendChild(detail);
      riskList.appendChild(box);
    }
  }
  function showTable(execution) {
    if (!execution || !Array.isArray(execution.rows)) return;
    const columns = Array.isArray(execution.columns) ? execution.columns.slice(0,50) : [];
    if (!columns.length) return;
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const tr = document.createElement('tr');
    for (const column of columns) {
      const th = document.createElement('th');
      th.scope = 'col';
      th.textContent = String(column);
      tr.appendChild(th);
    }
    thead.appendChild(tr);
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    for (const row of execution.rows.slice(0,1000)) {
      const line = document.createElement('tr');
      for (const column of columns) {
        const td = document.createElement('td');
        const value = row && typeof row === 'object' ? row[column] : null;
        td.textContent = value == null ? 'NULL' : String(value);
        line.appendChild(td);
      }
      tbody.appendChild(line);
    }
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    tableWrap.hidden = false;
    metricLine.hidden = false;
    metricLine.textContent = '返回 ' + execution.rows.length + ' 行' + (execution.truncated ? '（结果已截断）' : '');
  }
  function render(data) {
    resetResult();
    if (!data || typeof data !== 'object') {
      setStatus('error', '服务返回了无法识别的响应。');
      return;
    }
    if (typeof data.generated_sql === 'string' && data.generated_sql) {
      lastSql = data.generated_sql;
      sqlCode.textContent = lastSql;
      sqlDetails.hidden = false;
    }
    showRisks(data.risk_review);
    const state = data.status;
    if (state === 'ok') {
      setStatus('ok', '查询成功。未检测到已知语义风险；这不代表已经证明 SQL 业务口径完全正确。');
      showTable(data.execution);
    } else if (state === 'partial') {
      setStatus('warn', '查询已完成，但结果被截断，只展示部分数据。不可直接当作完整结果。');
      showTable(data.execution);
    } else if (state === 'needs_review') {
      setStatus('warn', data.message || '检测到业务口径风险，已停止执行，请人工核验。');
    } else if (state === 'clarify') {
      setStatus('neutral', '需要补充信息：' + (data.message || '请明确统计口径。'));
    } else if (state === 'unsupported') {
      setStatus('warn', '暂不支持：' + (data.message || '当前数据或权限无法回答。'));
    } else if (state === 'error') {
      setStatus('error', '查询未成功：' + (data.error?.message || data.message || '请检查请求或服务配置。'));
    } else {
      setStatus('error', '未知响应状态，未显示业务结果。');
    }
    if (typeof data.generation_ms === 'number') labelLine('SQL 生成', data.generation_ms.toFixed(0) + ' ms');
    if (typeof data.execution?.duration_ms === 'number') labelLine('SQL 执行', data.execution.duration_ms.toFixed(0) + ' ms');
    if (typeof data.usage?.total_tokens === 'number') labelLine('Tokens', String(data.usage.total_tokens));
    if (data.automatic_repair === false) labelLine('自动修复', '未启用');
  }
  async function send() {
    if (busy) return;
    const question = input.value.trim();
    if (!question) { input.focus(); return; }
    busy = true;
    submit.disabled = true;
    input.disabled = true;
    document.querySelectorAll('.example').forEach(b => b.disabled = true);
    resetResult();
    setStatus('neutral', '正在生成 SQL 并检查执行权限，请稍候…');
    try {
      const response = await fetch('/api/v2/query', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({question}),
      });
      let data;
      try { data = await response.json(); } catch (_) { throw new Error('服务器没有返回有效 JSON'); }
      if (!response.ok) {
        if (response.status === 404) throw new Error('V2 试验接口尚未启用。请在启动服务前设置 DATAPILOT_V2_ENABLED=1。');
        if (response.status === 403) throw new Error('V2 仅允许本机访问。');
        const detail = typeof data?.detail === 'string' ? data.detail : 'HTTP ' + response.status;
        throw new Error(detail);
      }
      render(data);
    } catch (err) {
      resetResult();
      setStatus('error', '请求失败：' + (err?.message || '网络或服务异常'));
    } finally {
      busy = false;
      submit.disabled = false;
      input.disabled = false;
      document.querySelectorAll('.example').forEach(b => b.disabled = false);
      input.focus();
    }
  }
  form.addEventListener('submit', event => { event.preventDefault(); send(); });
  input.addEventListener('keydown', event => {
    if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) { event.preventDefault(); send(); }
  });
  document.querySelectorAll('.example').forEach(button => {
    button.addEventListener('click', () => { input.value = button.dataset.question || ''; input.focus(); });
  });
  $('copy-sql').addEventListener('click', async () => {
    if (!lastSql) return;
    try { await navigator.clipboard.writeText(lastSql); $('copy-sql').textContent = '已复制'; }
    catch (_) { $('copy-sql').textContent = '复制不可用，请手动选择 SQL'; }
  });
})();
</script>
</body>
</html>
