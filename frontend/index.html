
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>DataPilot · 电商数据智能助手</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #172b4d;
      color: white;
      padding: 20px 32px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 8px 0 0;
      color: #cbd5e1;
      font-size: 13px;
    }

    .layout {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 20px;
    }

    .panel {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 20px;
    }

    .examples h3 {
      margin-top: 0;
    }

    .example {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #dbe3ef;
      border-radius: 8px;
      background: #f8fafc;
      cursor: pointer;
      line-height: 1.6;
    }

    .example:hover {
      background: #eaf2ff;
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      height: 650px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 4px;
    }

    .message {
      padding: 13px 16px;
      border-radius: 10px;
      margin-bottom: 14px;
      max-width: 92%;
      line-height: 1.75;
    }

    .user {
      background: #e6efff;
      margin-left: auto;
    }

    .assistant {
      background: #f1f5f9;
      margin-right: auto;
    }

    .message-body {
      white-space: normal;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .message-body p {
        margin: 8px 0;
    }

    .message-body ul,
    .message-body ol {
        padding-left: 24px;
    }

    .message-body table {
        width: 100%;
        border-collapse: collapse;
        margin: 12px 0;
        font-size: 13px;
    }

    .message-body th,
    .message-body td {
        padding: 8px;
        border: 1px solid #dbe3ef;
        text-align: left;
    }

    .message-body th {
        background: #e2e8f0;
    }

    .message-body pre {
        overflow-x: auto;
        padding: 12px;
        background: #e2e8f0;
        border-radius: 8px;
    }

    .message-label {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .tool-tag {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 8px;
      background: #e0f2fe;
      color: #075985;
      border-radius: 5px;
      font-size: 11px;
    }

    form {
      display: flex;
      gap: 10px;
      border-top: 1px solid #e2e8f0;
      padding-top: 16px;
    }

    textarea {
      flex: 1;
      resize: vertical;
      min-height: 54px;
      max-height: 140px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px;
      font: inherit;
    }

    button.send {
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 8px;
      padding: 0 20px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .disclaimer {
      color: #64748b;
      font-size: 12px;
      margin-top: 12px;
      line-height: 1.6;
    }

    @media (max-width: 720px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .chat-panel {
        height: 65vh;
        min-height: 430px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>DataPilot</h1>
    <p>电商数据分析 · 延期风险评分 · AI Agent</p>
  </header>

  <main class="layout">

    <aside class="panel examples">
      <h3>示例问题</h3>

      <button class="example" data-question=
        "Olist数据集中已交付的订单有多少笔？">
        已交付订单统计
      </button>

      <button class="example" data-question=
        "2018年3月的订单延期率是多少？">
        月度配送表现
      </button>

      <button class="example" data-question=
        "帮我评估一笔订单：7月购买，星期二，2件商品，商品金额199.9，客户在SP州。">
        订单延期风险评分
      </button>

      <p class="disclaimer">
        数据来源：历史 Olist 数据集。
        机器学习评分未经概率校准，仅供实验演示。
      </p>
    </aside>

    <section class="panel chat-panel">
        <div style="text-align:right; margin-bottom:12px;">
          <button type="button" id="new-chat">
            + 新建对话
          </button>
        </div>
      <div id="messages" aria-live="polite"></div>

      <form id="chat-form">
        <textarea
          id="question"
          placeholder="输入一个电商数据分析问题..."
          maxlength="2000"
          required
        ></textarea>

        <button id="send" class="send" type="submit">
          发送
        </button>
      </form>
    </section>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.2.1/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const questionInput = document.getElementById("question");
    const sendButton = document.getElementById("send");

    let busy = false;
    let conversationId = null;

    // 安全显示消息，不把模型回答当成HTML执行
    function addMessage(role, text, usedTools = []) {
      const box = document.createElement("article");
      box.className = "message " + role;

      const label = document.createElement("div");
      label.className = "message-label";
      label.textContent =
        role === "user" ? "你" : "DataPilot Agent";

      const body = document.createElement("div");
      body.className = "message-body";
      if (
          role === "assistant" &&
          typeof marked !== "undefined" &&
          typeof DOMPurify !== "undefined"
        ) {
          const html = marked.parse(text);

          body.innerHTML = DOMPurify.sanitize(html, {
            USE_PROFILES: { html: true },
            FORBID_TAGS: ["img", "style", "iframe"]
          });
        } else {
          body.textContent = text;
        }

      box.appendChild(label);
      box.appendChild(body);

      for (const toolName of usedTools) {
        const tag = document.createElement("span");
        tag.className = "tool-tag";
        tag.textContent = "调用工具：" + toolName;
        box.appendChild(tag);
      }

      messages.appendChild(box);
      messages.scrollTop = messages.scrollHeight;

      return box;
    }

    async function sendQuestion(question) {
      question = question.trim();
      if (!question || busy) return;

      busy = true;
      sendButton.disabled = true;
      questionInput.disabled = true;

      addMessage("user", question);
      questionInput.value = "";

      const loading = addMessage(
        "assistant",
        "正在查询数据或调用模型..."
      );

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
              question,
              conversation_id: conversationId
            })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            "请求失败，HTTP状态码：" + response.status
          );
        }
        conversationId = data.conversation_id;
        loading.remove();

        addMessage(
          "assistant",
          typeof data.answer === "string"
            ? data.answer
            : JSON.stringify(data.answer),
          Array.isArray(data.used_tools)
            ? data.used_tools
            : []
        );

      } catch (error) {
        loading.remove();
        addMessage("assistant", "请求失败：" + error.message);

      } finally {
        busy = false;
        sendButton.disabled = false;
        questionInput.disabled = false;
        questionInput.focus();
      }
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      sendQuestion(questionInput.value);
    });

    questionInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendQuestion(questionInput.value);
      }
    });

    document.querySelectorAll(".example").forEach(button => {
      button.addEventListener("click", () => {
        sendQuestion(button.dataset.question);
      });
    });

    addMessage(
      "assistant",
      "你好，我是 DataPilot！你可以询问历史电商业务数据，或提供订单信息进行延期风险评分。"
    );

    const newChatButton = document.getElementById("new-chat");
        newChatButton.addEventListener("click", () => {
          if (busy) return;

          conversationId = null;
          messages.replaceChildren();

          addMessage(
            "assistant",
            "已开始新对话。你可以继续咨询电商业务数据或订单延期风险。"
          );
        });
  </script>
</body>
</html>
